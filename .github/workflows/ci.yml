name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest   # net10.0-windows + WinForms targets require Windows

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # MinVer needs full history to compute version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Microsoft.Testing.Platform projects — run as executables, not via dotnet test
      # (unreliable MTP integration with dotnet test on .NET 10).
      - name: Test CDS.ScriptChat.Core.Tests
        run: dotnet run --project tests/CDS.ScriptChat.Core.Tests/CDS.ScriptChat.Core.Tests.csproj --no-build --configuration Release -- --report-trx --results-directory TestResults

      - name: Test CDS.ScriptChat.WinForms.Tests
        run: dotnet run --project tests/CDS.ScriptChat.WinForms.Tests/CDS.ScriptChat.WinForms.Tests.csproj --no-build --configuration Release -- --report-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0   # no floating v5 tag upstream — pin exact, verify with git ls-remote before bumping
